<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>

    @font-face {
        font-family: "CurseCasual";
        src: url("Curse Casual.ttf");
    }

    hr {
        width: 80%;
    }

    body {
        background-image: url("Time_RIft.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: white;
        font-family: "CurseCasual", sans-serif;
        text-align: center;
    }

    .time-rift {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(10px);
        z-index: -1;
    }

    .shop-container {
        background-color: #e6de4f;
        padding: 4px;
        width: 45%;
        margin: 50px auto;
        border-radius: 15px;
        border: 2px solid #eefaaa;
        box-shadow: 0px 0px 15px rgb(239, 255, 135);
    }

    .shop-container2 {
        background-color: #372243;
        padding: 15px;
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 3px solid #eefaaa;
        box-shadow: 0px 0px 10px rgb(239, 255, 135);
    }

    .sku-box {
        background-color: #1688e8;
        border: 4px solid #07152f;
        border-radius: 10px;
        padding: 15px;
        box-sizing: border-box;
        box-shadow: 0px 0px 5px rgb(33, 2, 84);
    }

    .sku-box h1 {
        background-color: #07152f;
        margin: -15px -15px 20px -15px;
        padding: 10px;
        font-size: 45px;
    }

    .category-title {
        font-size: 40px;
        margin-bottom: 15px;
        text-align: center;
    }

    .categories {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
    }

    .categories label {
        background-color: #07152f;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 20px;
        vertical-align: middle;
        margin-left: 5px;
        margin-right: 5x;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .categories input {
        width: 20px;
        height: 20px;
        margin: 0;
    }

    .input-title {
        display: block;
        font-size: 40px;
        margin-top: 20px;
        margin-bottom: 8px;
        text-align: center;
    }

    .text-input {
        width: 65%;
        height: 45px;
        border-radius: 8px;
        border: 2px solid #07152f;
        font-family: "CurseCasual", sans-serif;
        font-size: 20px;
        text-align: center;
        box-sizing: border-box;
    }

    .quantity {
        width: 65%;
        height: 45px;
        border-radius: 8px;
        border: 2px solid #07152f;
        font-family: "CurseCasual", sans-serif;
        font-size: 20px;
        text-align: center;
        box-sizing: border-box;
    }

    button {
        background-color: #e62b45;
        color: white;
        border: none;
        padding: 12px 25px;
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background-color: #ff5268;
    }

    #sku_output {
        background-color: #eeeeee;
        color: black;
        width: 65%;
        min-height: 50px;
        margin: 25px auto 10px auto;
        padding: 15px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 2px solid #07152f;
        font-size: 25px;
    }

    </style>

</head>

<body>

    <img src="Time_Rift.webp" class="time-rift">

    <div class="shop-container">

        <div class="shop-container2">

            <div class="sku-box">

                <h1>SKU GENERATOR</h1>

                <p class="category-title">Product Categories</p>

                <div class="categories">

                    <label>
                        <input type="radio" id="badges" name="category">
                        Badges
                    </label>

                    <label>
                        <input type="radio" id="hats" name="category">
                        Hats
                    </label>

                    <label>
                        <input type="radio" id="cosmetics" name="category">
                        Cosmetics
                    </label>

                </div>

                <hr>

                <label class="input-title">
                    Product Name
                </label>

                <input
                    type="text"
                    id="product_name"
                    class="text-input"
                    placeholder="Example: Item Magnet Badge"
                >

                <br><br>
                <hr>


                <label class="input-title">
                    Stock Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    class="quantity"
                    placeholder="7312011"
                >

                <br><br>
                <hr>

                <button py-click="SKU_generator">
                    GENERATE SKU
                </button>

                <div id="sku_output"></div>

            </div>

        </div>

    </div>

<script type="py" src="main.py"></script>

</body>

</html>
