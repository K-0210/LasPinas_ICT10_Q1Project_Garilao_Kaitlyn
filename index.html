<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Hat in Time</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>

    @font-face {
        font-family: "CurseCasual";
        src: url("Curse Casual.ttf");
    }

    body {
        background-image: url("Time_RIft.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: white;
        font-family: "CurseCasual", sans-serif;
        text-align: center;
    }

    .description {
        height: 80px;
        background-color: #07152f;
        margin-left: -15px;
        margin-right: -15px;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .badge {
        background-color: #1688e8;
        border: 4px solid #07152f;
        border-radius: 10px;
        padding: 15px;
        width: 100%;
        height: 500px;
        box-sizing: border-box;
        box-shadow: 0px 0px 5px rgb(33, 2, 84);
    }

    .badge h2 {
        background-color: #07152f;
        margin-left: -15px;
        margin-right: -15px;
        font-size: 30px;
    }

    .price {
        width: fit-content;
        margin: 0 auto;
        margin-bottom: 15px;
        padding: 5px 10px;
        font-size: 20px;
        font-weight: bold;
        color: #f5e504;
        height: 40px;
        background-color: #1b1b1b;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #0f0f0f;
    }

    button {
        background-color: #e62b45;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background-color: #ff5268;
    }

    .badge img {
        width: 150px;
        height: 150px;
        object-fit: contain;
    }

    .purchase {
        width: 250px;
        height: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .purchase button {
        margin-bottom: 10px;
        width: 250px;
    }

    #show {
        background-color: #eeeeee;
        color: black;
        width: 250px;
        height: 300px;
        margin: 20px auto;
        padding: 15px;
        box-sizing: border-box;
        border-radius: 8px;
        font-size: 25px;
    }

    .price img {
        width: 25px;
        height: 25px;
        vertical-align: middle;
        margin-right: 5px;
        margin-bottom: 1px;
    }

    input {
        width: 50px;
        height: 50px;
        border-radius: 10px;
    }

    .shop {
        display: grid;
        grid-template-columns: 250px 250px;
        grid-auto-rows: 500px;
        justify-content: center;
        gap: 20px;
    }

    .shop-container {
        background-color: #e6de4f;
        padding: 4px;
        width: 45%;
        margin: 0 auto;
        border-radius: 15px;
        border: 2px solid #eefaaa;
        box-shadow: 0px 0px 15px rgb(239, 255, 135);
    }

    .shop-container2 {
        background-color: #372243;
        padding: 15px;
        width: 100%;
        height: 835px;
        box-sizing: border-box;
        border-radius: 10px;
        border: 3px solid #eefaaa;
        box-shadow: 0px 0px 10px rgb(239, 255, 135);
    }

    .time-rift {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(10px);
        z-index: -1;
    }

    .home {
        grid-column: 1 / 3;
        width: 100%;
        height: 800px;
        background-image: url("a-hat-in-time-crackhead.gif");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border: 4px solid #07152f;
        border-radius: 10px;
        padding: 15px;
        box-sizing: border-box;
        box-shadow: 0px 0px 5px rgb(33, 2, 84);
    }

    .home h1 {
        background-color: #07152f;
        margin: -15px -15px 10px -15px;
        padding: 5px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .home-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }


    .home-text {
        width: 100%;
        height: 200px;
        box-sizing: border-box;
        background-color: rgba(222, 223, 224, 0.354);
        border: 3px solid #ffffff;
        border-radius: 10px;
        box-shadow: 0px 0px 5px rgb(33, 2, 84);
        padding: 15px;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #1e022a;
    }

    .home-text2 {
        width: 100%;
        height: 200px;
        box-sizing: border-box;
        background-color: rgba(222, 223, 224, 0.354);
        border: 3px solid #ffffff;
        border-radius: 10px;
        box-shadow: 0px 0px 5px rgb(33, 2, 84);
        padding: 15px;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #1e022a;
    }

    .home hr {
        margin: 0;
    }

    .links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 25px;
    }

    .links a {
        background-color: #e62b45;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 5px;
    }

    .links a:hover {
        background-color: #ff5268;
    }

    .ahit-logo {
        width: 100px;
        height: auto;
    }

    </style>

</head>

<body>

    <img src="Time_Rift.webp" class="time-rift">

    <div class="shop-container">

        <div class="shop-container2">

            <div class="shop">

                <div class="home">

                    <h1><img src="AHIT.webp" class="ahit-logo"></h1>

                    <div class="home-content">

                        <div class="home-text">

                            <p>
                                --"Badges are... totally 'in' right now.
                                That's what I've been told to say.
                                So make a purchase, please."--
                            </p>
                        </div>

                            <div class="home-text2">
                                <p>--"Please disregard my twitchy behavior. 
                                My body has been to places that left 
                                a permanent mark."--</p>
                            </div>

                    </div>

                    <br>
                    <hr>

                    <div class="links">

                        <a href="sku.html">
                            SKU GENERATOR
                        </a>

                        <a href="receipt.html">
                            RECEIPT GENERATOR
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>

</html>
